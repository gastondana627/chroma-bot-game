<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Character Emergence System Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
        }

        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .test-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .test-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-group {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .control-group h3 {
            margin-top: 0;
            color: #00FFFF;
        }

        button {
            background: linear-gradient(45deg, #00FFFF, #FF0080);
            border: none;
            color: white;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .status-display {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 14px;
        }

        .chroma-orb-simulator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #00FFFF, #FF0080);
            border-radius: 50%;
            cursor: pointer;
            animation: pulse 2s infinite;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .log-container {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
        }

        .log-success { color: #00FF00; }
        .log-warning { color: #FFAA00; }
        .log-error { color: #FF4444; }
        .log-info { color: #00AAFF; }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="test-header">
            <h1>🎭 3D Character Emergence System Test</h1>
            <p>Test the 3D character emergence and return animations</p>
        </div>

        <div class="status-display" id="status-display">
            System Status: Initializing...
        </div>

        <div class="test-controls">
            <div class="control-group">
                <h3>Character Selection</h3>
                <button onclick="initializeCharacter('eli')">Initialize Eli</button>
                <button onclick="initializeCharacter('maya')">Initialize Maya</button>
                <button onclick="initializeCharacter('stanley')">Initialize Stanley</button>
            </div>

            <div class="control-group">
                <h3>Animation Controls</h3>
                <button onclick="testEmergence()" id="emerge-btn" disabled>Emerge Character</button>
                <button onclick="testReturn()" id="return-btn" disabled>Return to Orb</button>
                <button onclick="emergencyStop()">Emergency Stop</button>
            </div>

            <div class="control-group">
                <h3>System Controls</h3>
                <button onclick="toggleWebGLInfo()">Toggle WebGL Info</button>
                <button onclick="clearLogs()">Clear Logs</button>
                <button onclick="resetSystem()">Reset System</button>
            </div>
        </div>

        <div class="log-container" id="log-container">
            <div class="log-entry log-info">Test system initialized. Click buttons to test functionality.</div>
        </div>
    </div>

    <!-- Simulated chroma orb -->
    <div class="chroma-orb-simulator" id="chroma-orb" onclick="simulateOrbClick()">
        CHROMA<br>ORB
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- 3D System Scripts -->
    <script src="js/three-scene-manager.js"></script>
    <script src="js/character-3d-renderer.js"></script>
    <script src="js/character-emergence-animator.js"></script>
    <script src="js/character-return-animator.js"></script>
    <script src="js/character-3d-system.js"></script>
    <script src="js/3d-integration.js"></script>

    <script>
        // Test system state
        let testSystem = {
            sceneManager: null,
            character3DSystem: null,
            currentCharacter: null,
            isInitialized: false
        };

        // Initialize test system
        async function initializeTestSystem() {
            try {
                log('Initializing 3D test system...', 'info');
                
                // Create scene manager
                testSystem.sceneManager = new ThreeSceneManager();
                const initialized = testSystem.sceneManager.initialize();
                
                if (!initialized) {
                    log('WebGL not supported - 3D features disabled', 'warning');
                    updateStatus('WebGL Not Supported');
                    return false;
                }
                
                // Create character 3D system
                testSystem.character3DSystem = new Character3DSystem(testSystem.sceneManager);
                testSystem.isInitialized = true;
                
                log('3D test system initialized successfully', 'success');
                updateStatus('System Ready - Select a character to begin');
                return true;
                
            } catch (error) {
                log(`Failed to initialize test system: ${error.message}`, 'error');
                updateStatus('Initialization Failed');
                return false;
            }
        }

        // Initialize character
        async function initializeCharacter(character) {
            if (!testSystem.isInitialized) {
                log('Test system not initialized', 'error');
                return;
            }

            try {
                log(`Initializing character: ${character}`, 'info');
                updateStatus(`Initializing ${character}...`);
                
                const success = await testSystem.character3DSystem.initializeCharacter(character);
                
                if (success) {
                    testSystem.currentCharacter = character;
                    log(`Character ${character} initialized successfully`, 'success');
                    updateStatus(`${character} Ready`);
                    updateButtons();
                } else {
                    log(`Failed to initialize character ${character}`, 'error');
                    updateStatus('Character Initialization Failed');
                }
                
            } catch (error) {
                log(`Error initializing character ${character}: ${error.message}`, 'error');
                updateStatus('Character Initialization Error');
            }
        }

        // Test emergence animation
        async function testEmergence() {
            if (!testSystem.currentCharacter) {
                log('No character selected', 'warning');
                return;
            }

            try {
                log('Starting emergence animation test...', 'info');
                updateStatus('Emerging Character...');
                
                // Get orb position
                const orb = document.getElementById('chroma-orb');
                const rect = orb.getBoundingClientRect();
                const orbPosition = {
                    x: rect.left + rect.width / 2,
                    y: rect.top + rect.height / 2
                };
                
                const success = await testSystem.character3DSystem.emergeCharacter(orbPosition);
                
                if (success) {
                    log('Emergence animation completed successfully', 'success');
                    updateStatus(`${testSystem.currentCharacter} Active`);
                    updateButtons();
                } else {
                    log('Emergence animation failed', 'error');
                    updateStatus('Emergence Failed');
                }
                
            } catch (error) {
                log(`Emergence error: ${error.message}`, 'error');
                updateStatus('Emergence Error');
            }
        }

        // Test return animation
        async function testReturn() {
            if (!testSystem.currentCharacter) {
                log('No character selected', 'warning');
                return;
            }

            try {
                log('Starting return animation test...', 'info');
                updateStatus('Returning Character...');
                
                // Get orb position
                const orb = document.getElementById('chroma-orb');
                const rect = orb.getBoundingClientRect();
                const orbPosition = {
                    x: rect.left + rect.width / 2,
                    y: rect.top + rect.height / 2
                };
                
                const success = await testSystem.character3DSystem.returnCharacter(orbPosition);
                
                if (success) {
                    log('Return animation completed successfully', 'success');
                    updateStatus(`${testSystem.currentCharacter} Ready`);
                    updateButtons();
                } else {
                    log('Return animation failed', 'error');
                    updateStatus('Return Failed');
                }
                
            } catch (error) {
                log(`Return error: ${error.message}`, 'error');
                updateStatus('Return Error');
            }
        }

        // Simulate orb click
        async function simulateOrbClick() {
            if (!testSystem.currentCharacter) {
                log('Click a character initialization button first', 'info');
                return;
            }

            const isActive = testSystem.character3DSystem.isCharacterActive();
            
            if (isActive) {
                await testReturn();
            } else {
                await testEmergence();
            }
        }

        // Emergency stop
        function emergencyStop() {
            if (testSystem.character3DSystem) {
                testSystem.character3DSystem.emergencyStop();
                log('Emergency stop executed', 'warning');
                updateStatus('Emergency Stop');
                updateButtons();
            }
        }

        // Reset system
        async function resetSystem() {
            if (testSystem.character3DSystem) {
                await testSystem.character3DSystem.cleanup();
            }
            
            testSystem.currentCharacter = null;
            log('System reset', 'info');
            updateStatus('System Reset - Select a character');
            updateButtons();
        }

        // Update button states
        function updateButtons() {
            const emergeBtn = document.getElementById('emerge-btn');
            const returnBtn = document.getElementById('return-btn');
            
            if (!testSystem.currentCharacter) {
                emergeBtn.disabled = true;
                returnBtn.disabled = true;
                return;
            }

            const isActive = testSystem.character3DSystem ? testSystem.character3DSystem.isCharacterActive() : false;
            const isTransitioning = testSystem.character3DSystem ? testSystem.character3DSystem.isSystemTransitioning() : false;
            
            emergeBtn.disabled = isActive || isTransitioning;
            returnBtn.disabled = !isActive || isTransitioning;
        }

        // Update status display
        function updateStatus(status) {
            const statusDisplay = document.getElementById('status-display');
            const systemStatus = testSystem.character3DSystem ? testSystem.character3DSystem.getSystemStatus() : {};
            
            statusDisplay.innerHTML = `
                <strong>Status:</strong> ${status}<br>
                <strong>Character:</strong> ${testSystem.currentCharacter || 'None'}<br>
                <strong>State:</strong> ${systemStatus.state || 'Unknown'}<br>
                <strong>WebGL:</strong> ${testSystem.sceneManager ? testSystem.sceneManager.isAvailable() : false}
            `;
        }

        // Toggle WebGL info
        function toggleWebGLInfo() {
            if (testSystem.sceneManager) {
                const perfInfo = testSystem.sceneManager.getPerformanceInfo();
                if (perfInfo) {
                    log(`WebGL Performance: ${JSON.stringify(perfInfo, null, 2)}`, 'info');
                } else {
                    log('WebGL performance info not available', 'warning');
                }
            }
        }

        // Clear logs
        function clearLogs() {
            const logContainer = document.getElementById('log-container');
            logContainer.innerHTML = '<div class="log-entry log-info">Logs cleared.</div>';
        }

        // Log function
        function log(message, type = 'info') {
            const logContainer = document.getElementById('log-container');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = `[${timestamp}] ${message}`;
            
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
            
            // Also log to console
            console.log(`[3D Test] ${message}`);
        }

        // Initialize when page loads
        window.addEventListener('load', () => {
            initializeTestSystem();
        });

        // Update buttons periodically
        setInterval(updateButtons, 500);
    </script>
</body>
</html>
